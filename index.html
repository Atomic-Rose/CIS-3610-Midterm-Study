, "statement": "Which of the following best characterizes a headless CMS architecture?", "options": ["A system that completely lacks any front-end user interface and serves content via APIs", "A monolithic application where template engines render HTML directly on the server", "A database engine that does not utilize indexing tables", "An operating system running without a graphical display monitor"], "answer": "A", "explanation": "A headless CMS separates content management from the presentation layer and delivers content through APIs. It may still include an administrative editing interface.", "sources": [{"file": "midterm-review.txt", "location": "Question 7"}]}, {"id": "Q008", "chapter": 1, "number": 8, "topic": "Configuration & secrets", "difficulty": "Review", "statement": "Why is separating environment configuration from source code considered critical in web infrastructure?", "options": ["It prevents CSS stylesheets from conflicting with JavaScript runtimes", "It protects sensitive secrets, API keys, and database credentials from public code exposure", "It ensures web pages render faster on mobile viewports", "It automates DNS propagation across multiple registrars"], "answer": "B", "explanation": "Separate configuration keeps secrets out of committed source and permits different settings for development and production. Environment variables exposed to browser bundles are still public.", "sources": [{"file": "midterm-review.txt", "location": "Question 8"}]}, {"id": "Q009", "chapter": 1, "number": 9, "topic": "Content delivery", "difficulty": "Review", "statement": "What does the acronym CDN stand for in modern cloud web architectures?", "options": ["Central Database Node", "Content Delivery Network", "Cascading Design Notation", "Common Developer Namespace"], "answer": "B", "explanation": "A Content Delivery Network caches and serves content from distributed locations, often reducing delivery latency and origin load.", "sources": [{"file": "midterm-review.txt", "location": "Question 9"}]}, {"id": "Q010", "chapter": 1, "number": 10, "topic": "HTTP & TLS", "difficulty": "Review", "statement": "Which of the following illustrates a typical request-response lifecycle step?", "options": ["The database executes a cron job without user intervention", "The client browser sends an HTTP GET request to a server endpoint and receives an HTML/JSON payload", "The compiler translates TypeScript interfaces into binary machine instructions", "The Git repository commits local changes automatically"], "answer": "B", "explanation": "A browser request followed by a server response is a request-response exchange. The response may contain HTML, JSON, or another representation.", "sources": [{"file": "midterm-review.txt", "location": "Question 10"}]}, {"id": "Q011", "chapter": 1, "number": 11, "topic": "APIs & events", "difficulty": "Review", "statement": "What is the primary role of an API (Application Programming Interface) in an e-business ecosystem?", "options": ["To provide physical cooling for server racks", "To allow disparate software systems to securely communicate and exchange data", "To format text documents into PDF layouts", "To replace semantic HTML tags with proprietary containers"], "answer": "B", "explanation": "An API supplies a defined contract for software interaction. Secure use still requires appropriate authentication, authorization, and validation.", "sources": [{"file": "midterm-review.txt", "location": "Question 11"}]}, {"id": "Q012", "chapter": 1, "number": 12, "topic": "HTTP & TLS", "difficulty": "Review", "statement": "Which protocol secures HTTP traffic through encryption and cryptographic verification?", "options": ["FTP", "Telnet", "HTTPS (TLS/SSL)", "POP3"], "answer": "C", "explanation": "HTTPS uses TLS to encrypt transport and authenticate the server through certificates. SSL is an older, obsolete predecessor.", "sources": [{"file": "midterm-review.txt", "location": "Question 12"}]}, {"id": "Q013", "chapter": 1, "number": 13, "topic": "Deployment & scaling", "difficulty": "Review", "statement": "What is the main benefit of utilizing cloud-based deployment platforms like Vercel or Netlify for modern web apps?", "options": ["Eliminating all potential cyber security vulnerabilities", "Automated continuous deployment pipelines connected directly to Git repositories", "Guaranteed exemption from data privacy regulations", "Manual server rack configuration requirements"], "answer": "B", "explanation": "Git-connected deployments can build and publish updates automatically. Developers remain responsible for security and configuration.", "sources": [{"file": "midterm-review.txt", "location": "Question 13"}]}, {"id": "Q014", "chapter": 1, "number": 14, "topic": "Client-server architecture", "difficulty": "Review", "statement": "Which term describes an architecture where business logic runs on the client browser while data is fetched asynchronously from backend services?", "options": ["Single-Page Application (SPA)", "Mainframe Batch Processing", "Static Punch-Card System", "Terminal Emulation Server"], "answer": "A", "explanation": "An SPA updates its interface in the browser and commonly fetches data without downloading a complete page on each navigation.", "sources": [{"file": "midterm-review.txt", "location": "Question 14"}]}, {"id": "Q015", "chapter": 1, "number": 15, "topic": "APIs & events", "difficulty": "Review", "statement": "What is the primary purpose of a webhook in event-driven web architecture?", "options": ["To continuously poll a server for status changes every second", "To allow an external service to push real-time HTTP POST notifications to a designated endpoint when an event occurs", "To minify CSS stylesheets before production build", "To scrape competitor pricing data automatically"], "answer": "B", "explanation": "A webhook delivers an event notification to a configured HTTP endpoint. Receivers should authenticate notifications and handle retries safely.", "sources": [{"file": "midterm-review.txt", "location": "Question 15"}]}, {"id": "Q016", "chapter": 1, "number": 16, "topic": "Payment security", "difficulty": "Review", "statement": "In the context of e-commerce infrastructure, what does PCI-DSS compliance govern?", "options": ["Academic grading standards for computer science courses", "Security standards for organizations handling credit card and payment data", "Web accessibility guidelines for individuals with visual impairments", "Open-source licensing compatibility matrices"], "answer": "B", "explanation": "PCI DSS addresses protection of payment card account data. It is distinct from accessibility standards such as WCAG.", "sources": [{"file": "midterm-review.txt", "location": "Question 16"}]}, {"id": "Q017", "chapter": 1, "number": 17, "topic": "Deployment & scaling", "difficulty": "Review", "statement": "What is a primary characteristic of cloud elasticity?", "options": ["Fixed hardware allocation that cannot be changed after purchase", "The ability to dynamically scale computing resources up or down based on traffic demand", "Permanent static IP address assignment for all client devices", "Elimination of network latency across global regions"], "answer": "B", "explanation": "Elastic infrastructure adjusts allocated capacity to demand, rather than requiring a permanently fixed allocation.", "sources": [{"file": "midterm-review.txt", "location": "Question 17"}]}, {"id": "Q018", "chapter": 1, "number": 18, "topic": "Project configuration", "difficulty": "Review", "statement": "Which file is standardly used in Node.js projects to list dependencies, scripts, and project metadata?", "options": ["index.html", "package.json", "styles.css", "tsconfig.json"], "answer": "B", "explanation": "package.json describes a Node.js package, including its metadata, dependencies, and runnable scripts.", "sources": [{"file": "midterm-review.txt", "location": "Question 18"}]}, {"id": "Q019", "chapter": 1, "number": 19, "topic": "HTTP & TLS", "difficulty": "Review", "statement": "What is the function of an SSL/TLS certificate in web communications?", "options": ["To verify domain ownership and encrypt data transmitted between client and server", "To compress image assets for faster mobile loading", "To generate automatic unit tests for React components", "To store user passwords in plain text for easy retrieval"], "answer": "A", "explanation": "A certificate binds an identity such as a domain to a public key. TLS uses certificates for authentication and negotiates keys to encrypt the connection; a certificate alone does not encrypt traffic.", "sources": [{"file": "midterm-review.txt", "location": "Question 19"}]}, {"id": "Q020", "chapter": 1, "number": 20, "topic": "Async JavaScript", "difficulty": "Review", "statement": "Which of the following represents an asynchronous JavaScript execution pattern commonly used for API calls?", "options": ["Synchronous file blocking loops", "Async/Await and Promises", "Static HTML injection tags", "Monolithic shell scripts"], "answer": "B", "explanation": "Promises represent eventual completion or failure. Async/await provides syntax for working with those promises.", "sources": [{"file": "midterm-review.txt", "location": "Question 20"}]}, {"id": "Q021", "chapter": 2, "number": 21, "topic": "Semantic HTML", "difficulty": "Review", "statement": "Why is the use of semantic HTML5 elements (such as <header>, <nav>, <main>, and <footer>) preferred over generic wrappers?", "options": ["They execute JavaScript code faster in browser engines", "They provide meaningful structural context to screen readers, search engine crawlers, and developers", "They automatically encrypt form inputs against SQL injection", "They remove the need for CSS styling entirely"], "answer": "B", "explanation": "Semantic elements convey structure and purpose beyond appearance. Generic div elements do not provide these meanings by default.", "sources": [{"file": "midterm-review.txt", "location": "Question 21"}]}, {"id": "Q022", "chapter": 2, "number": 22, "topic": "Accessibility fundamentals", "difficulty": "Review", "statement": "What does WCAG stand for in the context of digital accessibility standards?", "options": ["Web Content Accessibility Guidelines", "Worldwide Cascading Architecture Group", "Wireless Code Authentication Governance", "Web Component Access Protocol"], "answer": "A", "explanation": "WCAG means Web Content Accessibility Guidelines, a set of success criteria for accessible web content.", "sources": [{"file": "midterm-review.txt", "location": "Question 22"}]}, {"id": "Q023", "chapter": 2, "number": 23, "topic": "Accessibility fundamentals", "difficulty": "Review", "statement": "Which WCAG conformance level is typically established as the standard target for enterprise and educational web accessibility?", "options": ["Level A", "Level AA", "Level AAA", "Level Z"], "answer": "B", "explanation": "AA is a common accessibility target and includes all applicable Level A and Level AA criteria. It does not imply every AAA criterion is met.", "sources": [{"file": "midterm-review.txt", "location": "Question 23"}]}, {"id": "Q024", "chapter": 2, "number": 24, "topic": "Accessible images", "difficulty": "Review", "statement": "How do screen readers interpret images that lack appropriate alt text attributes?", "options": ["They intelligently generate a detailed description of the image contents", "They either skip the image or read out the raw file name, hindering accessibility for visually impaired users", "They crash the browser tab immediately", "They automatically apply decorative styling filters"], "answer": "B", "explanation": "Without useful alternative text, an image may be announced as a filename or provide no meaningful information. Decorative images should use an empty alt attribute.", "sources": [{"file": "midterm-review.txt", "location": "Question 24"}]}, {"id": "Q025", "chapter": 2, "number": 25, "topic": "AI UI scaffolding", "difficulty": "Review", "statement": "What is the primary purpose of text-to-design prototyping tools like v0.dev in modern UI workflows?", "options": ["Replacing all software engineers with automated bots", "Translating natural language product requirements into functional UI component code layouts", "Compiling database migrations into relational schemas", "Generating SSL certificates for domain registrars"], "answer": "B", "explanation": "Text-to-design tools turn a natural-language brief into an initial interface or component layout that still requires review.", "sources": [{"file": "midterm-review.txt", "location": "Question 25"}]}, {"id": "Q026", "chapter": 2, "number": 26, "topic": "Responsive layout", "difficulty": "Review", "statement": "In responsive web design, what CSS mechanism allows flexible layouts across varying screen sizes without fixed pixel widths?", "options": ["Flexbox and CSS Grids with relative units (percentages, rem, vw)", "Hardcoded table cell widths in HTML attributes", "Static inline styling blocks", "Flash plugin containers"], "answer": "A", "explanation": "Flexible layout systems and relative sizing let content adapt to available space. Fixed widths alone often produce overflow.", "sources": [{"file": "midterm-review.txt", "location": "Question 26"}]}, {"id": "Q027", "chapter": 2, "number": 27, "topic": "AI UI scaffolding", "difficulty": "Review", "statement": "What is the primary risk of relying entirely on AI-generated UI code without manual inspection?", "options": ["Inefficient CSS syntax, unsemantic markup, and hidden accessibility flaws", "Instantaneous server crashes across all cloud regions", "Automatic cancellation of domain name registrations", "Permanent deletion of Git commit histories"], "answer": "A", "explanation": "Generated code can contain inaccessible controls, weak semantics, or unnecessary styling. Manual inspection and functional testing are still needed.", "sources": [{"file": "midterm-review.txt", "location": "Question 27"}]}, {"id": "Q028", "chapter": 2, "number": 28, "topic": "Accessible forms", "difficulty": "Review", "statement": "Which HTML attribute is essential for providing accessible descriptions of form input fields?", "options": ["aria-label or associated <label> elements with matching for and id attributes", "style=\"display:none\"", "class=\"hidden-input\"", "onclick=\"validate()\""], "answer": "A", "explanation": "A visible label associated using for and id supplies an accessible name. aria-label can provide a name when a suitable visible label is unavailable.", "sources": [{"file": "midterm-review.txt", "location": "Question 28"}]}, {"id": "Q029", "chapter": 2, "number": 29, "topic": "CSS fundamentals", "difficulty": "Review", "statement": "What does the CSS Box Model encompass from innermost to outermost?", "options": ["Margin, Border, Padding, Content", "Content, Padding, Border, Margin", "Border, Content, Margin, Padding", "Padding, Margin, Content, Border"], "answer": "B", "explanation": "The box model proceeds outward from content to padding, border, then margin. Padding is inside the border; margin is outside it.", "sources": [{"file": "midterm-review.txt", "location": "Question 29"}]}, {"id": "Q030", "chapter": 2, "number": 30, "topic": "Accessibility fundamentals", "difficulty": "Review", "statement": "Which of the following best describes Universal Design in digital products?", "options": ["Designing products to be usable by all people to the greatest extent possible without needing adaptation", "Building separate websites exclusively for mobile devices", "Restricting software access to expert technical users", "Utilizing only monochrome color schemes"], "answer": "A", "explanation": "Universal Design seeks broad usability from the outset instead of relying on separate adaptations for every user group.", "sources": [{"file": "midterm-review.txt", "location": "Question 30"}]}, {"id": "Q031", "chapter": 2, "number": 31, "topic": "Color contrast", "difficulty": "Review", "statement": "What role do color contrast ratios play in web accessibility standards?", "options": ["They determine how fast images load on slow cellular connections", "They ensure text is legible against background colors for users with visual impairments or color blindness", "They calculate the monetary cost of cloud hosting bandwidth", "They dictate database indexing efficiency"], "answer": "B", "explanation": "Sufficient contrast makes foreground text distinguishable from its background. Color alone should not carry essential information.", "sources": [{"file": "midterm-review.txt", "location": "Question 31"}]}, {"id": "Q032", "chapter": 2, "number": 32, "topic": "Keyboard access", "difficulty": "Review", "statement": "Why is keyboard navigation testing critical for web accessibility?", "options": ["Many users with motor impairments or screen readers navigate web interfaces primarily using keyboard controls (Tab, Enter, Arrow keys)", "Keyboards are faster than computer mice for database administration", "Browsers disable mouse clicks during production deployments", "It prevents CSS stylesheets from loading incorrectly"], "answer": "A", "explanation": "Keyboard testing checks whether users can reach and operate controls without a pointing device, with a visible focus indicator and no keyboard traps.", "sources": [{"file": "midterm-review.txt", "location": "Question 32"}]}, {"id": "Q033", "chapter": 2, "number": 33, "topic": "Semantic HTML", "difficulty": "Review", "statement": "What is the function of the <main> landmark element in semantic HTML?", "options": ["Containing site-wide navigation links and logos", "Enclosing the primary dominant content unique to the document", "Storing JavaScript event listener definitions", "Holding copyright notices and footer links"], "answer": "B", "explanation": "The main element identifies the dominant content of the page. The pasted question lost this tag; the study app restores it.", "sources": [{"file": "midterm-review.txt", "location": "Question 33"}]}, {"id": "Q034", "chapter": 2, "number": 34, "topic": "Responsive layout", "difficulty": "Review", "statement": "Which CSS layout module is best suited for one-dimensional layouts (rows or columns)?", "options": ["CSS Flexbox", "CSS Grid", "HTML Tables", "Absolute Positioning Floats"], "answer": "A", "explanation": "Flexbox arranges items along a primary axis, making it well suited to a row or column.", "sources": [{"file": "midterm-review.txt", "location": "Question 34"}]}, {"id": "Q035", "chapter": 2, "number": 35, "topic": "Responsive layout", "difficulty": "Review", "statement": "Which CSS layout module is optimized for two-dimensional layouts (rows and columns simultaneously)?", "options": ["CSS Grid", "Inline Block", "Float Clearing", "Bulleted Lists"], "answer": "A", "explanation": "Grid coordinates rows and columns together, making it suited to two-dimensional page layouts.", "sources": [{"file": "midterm-review.txt", "location": "Question 35"}]}, {"id": "Q036", "chapter": 2, "number": 36, "topic": "Responsive typography", "difficulty": "Review", "statement": "What does responsive typography entail in modern web design?", "options": ["Using fixed 12px fonts across all screen resolutions", "Scaling font sizes fluidly using relative units (such as rem or clamp()) to maintain readability across viewports", "Embedding rasterized images of text instead of live characters", "Disabling font smoothing on mobile devices"], "answer": "B", "explanation": "Relative units and clamp() can adjust text sizing across viewports while respecting usable bounds and user settings.", "sources": [{"file": "midterm-review.txt", "location": "Question 36"}]}, {"id": "Q037", "chapter": 2, "number": 37, "topic": "AI transparency", "difficulty": "Review", "statement": "What is an AI Transparency Log used for in AI-augmented engineering coursework?", "options": ["Tracking the exact prompt iterations, AI tool outputs, and human verification/refactoring steps performed", "Logging the electricity consumption of local server racks", "Recording customer credit card transactions in plain text", "Generating automated invoice summaries"], "answer": "A", "explanation": "A transparency log records how AI assistance was used and how a person checked or changed the result. It supports traceability of engineering decisions.", "sources": [{"file": "midterm-review.txt", "location": "Question 37"}]}, {"id": "Q038", "chapter": 2, "number": 38, "topic": "Accessible links", "difficulty": "Review", "statement": "Why should web developers avoid using \"click here\" as anchor link text?", "options": ["It provides no contextual information about the link destination for screen reader users scanning page links", "It violates JavaScript syntax rules", "It prevents CSS styles from applying correctly", "It increases server response time"], "answer": "A", "explanation": "Descriptive link text communicates the destination or action, including when screen reader users browse links out of surrounding context.", "sources": [{"file": "midterm-review.txt", "location": "Question 38"}]}, {"id": "Q039", "chapter": 2, "number": 39, "topic": "Semantic HTML", "difficulty": "Review", "statement": "What is the purpose of semantic heading tags (<h1> through <h6>)?", "options": ["To establish a clear, hierarchical document outline that aids navigation and comprehension", "To change font colors randomly across paragraphs", "To define database table relationships", "To inject executable script payloads into the DOM"], "answer": "A", "explanation": "Heading levels h1 through h6 express a content hierarchy. Choose levels for structure and style them separately with CSS.", "sources": [{"file": "midterm-review.txt", "location": "Question 39"}]}, {"id": "Q040", "chapter": 2, "number": 40, "topic": "Progressive enhancement", "difficulty": "Review", "statement": "How does progressive enhancement affect web development strategy?", "options": ["Building a baseline functional experience for all browsers first, then layering advanced styling and JS for capable modern browsers", "Designing exclusively for the newest browser version and blocking older clients", "Eliminating HTML entirely in favor of compiled binary applications", "Ignoring mobile devices until desktop optimization is 100% complete"], "answer": "A", "explanation": "Progressive enhancement begins with a useful baseline, then adds features where supported so core access remains broadly available.", "sources": [{"file": "midterm-review.txt", "location": "Question 40"}]}, {"id": "Q041", "chapter": 3, "number": 41, "topic": "DOM & events", "difficulty": "Review", "statement": "What is the primary role of the Document Object Model (DOM) in web browsers?", "options": ["Storing persistent records on cloud database servers", "Representing the page so programs can change document structure, style, and content dynamically", "Compiling TypeScript interfaces into bytecode", "Managing DNS routing tables"], "answer": "B", "explanation": "The DOM exposes the document as a tree of nodes that scripts can inspect and update.", "sources": [{"file": "midterm-review.txt", "location": "Question 41"}]}, {"id": "Q042", "chapter": 3, "number": 42, "topic": "DOM & events", "difficulty": "Review", "statement": "How do JavaScript event listeners function within a web application?", "options": ["They wait for specific user interactions (like clicks, keypresses, or form submissions) and execute callback functions in response", "They compile server-side SQL queries into relational tables", "They encrypt local storage cookies automatically", "They check domain name registration expiration dates"], "answer": "A", "explanation": "An event listener registers a callback for an event. When that event is dispatched, the registered handler can respond.", "sources": [{"file": "midterm-review.txt", "location": "Question 42"}]}, {"id": "Q043", "chapter": 3, "number": 43, "topic": "Debugging", "difficulty": "Review", "statement": "What is the primary purpose of browser developer tools (such as Chrome DevTools Console and Network tabs)?", "options": ["Designing marketing graphics and corporate logos", "Inspecting DOM elements, monitoring network requests, debugging JavaScript errors, and profiling performance", "Purchasing domain names and managing registrar accounts", "Provisioning virtual private servers in cloud data centers"], "answer": "B", "explanation": "Developer tools reveal document structure, network traffic, logs, and performance information needed to investigate behavior.", "sources": [{"file": "midterm-review.txt", "location": "Question 43"}]}, {"id": "Q044", "chapter": 3, "number": 44, "topic": "Scope & closures", "difficulty": "Review", "statement": "What does variable scope refer to in JavaScript programming?", "options": ["The speed at which a function executes mathematical calculations", "The accessibility and visibility of variables within different parts of code blocks or functions", "The amount of memory allocated for CSS stylesheets", "The number of parameters an API endpoint accepts"], "answer": "B", "explanation": "Scope determines where a binding is accessible. Block, function, and module/global scope affect visibility.", "sources": [{"file": "midterm-review.txt", "location": "Question 44"}]}, {"id": "Q045", "chapter": 3, "number": 45, "topic": "Scope & closures", "difficulty": "Review", "statement": "In JavaScript, what is the difference between let, const, and var for variable declarations?", "options": ["var is block-scoped, while let and const are globally scoped", "const declares variables that cannot be reassigned, while let and var allow reassignment with block vs function scoping", "There is no functional difference; they are interchangeable aliases", "const can only be used in server-side Node.js environments"], "answer": "B", "explanation": "let and const are block-scoped; var is function-scoped or global-scoped. const prevents reassignment of the binding but does not make an object immutable.", "sources": [{"file": "midterm-review.txt", "location": "Question 45"}]}, {"id": "Q046", "chapter": 3, "number": 46, "topic": "Debugging", "difficulty": "Review", "statement": "What is an asynchronous callback or promise rejection typically signalled by in browser consoles?", "options": ["A green success banner", "An uncaught exception or error stack trace log in red text", "An automatic database backup confirmation", "A DNS lookup redirection notice"], "answer": "B", "explanation": "Unhandled errors and promise rejections commonly produce console diagnostics and stack traces. Their exact display depends on the browser.", "sources": [{"file": "midterm-review.txt", "location": "Question 46"}]}, {"id": "Q047", "chapter": 3, "number": 47, "topic": "JSON & APIs", "difficulty": "Review", "statement": "What does JSON stand for in web data exchange?", "options": ["JavaScript Object Notation", "Java Secure Operational Network", "Joint Syntax Object Namespace", "jQuery Server Operation Node"], "answer": "A", "explanation": "JSON is JavaScript Object Notation, a text format for exchanging structured data. It is not executable JavaScript code.", "sources": [{"file": "midterm-review.txt", "location": "Question 47"}]}, {"id": "Q048", "chapter": 3, "number": 48, "topic": "Input validation", "difficulty": "Review", "statement": "Why is client-side input validation insufficient as a sole security measure?", "options": ["Client-side code runs on the user's device and can be easily bypassed or manipulated by malicious actors", "Browsers do not support JavaScript form validation functions", "Client validation slows down server response times significantly", "It prevents CSS stylesheets from rendering"], "answer": "A", "explanation": "A user controls their browser and can bypass local checks or send requests directly. The server must validate input and enforce authorization.", "sources": [{"file": "midterm-review.txt", "location": "Question 48"}]}, {"id": "Q049", "chapter": 3, "number": 49, "topic": "Array transformations", "difficulty": "Review", "statement": "What is the purpose of array manipulation methods like .map(), .filter(), and .reduce() in JavaScript?", "options": ["To execute declarative, functional transformations on data collections without mutating original arrays directly", "To query PostgreSQL databases using raw SQL syntax", "To configure Vercel deployment routing rules", "To compile TypeScript code into ES5 bundles"], "answer": "A", "explanation": "map returns mapped values, filter selects elements, and reduce accumulates a result. Their callbacks can still mutate referenced objects, so immutability is a coding practice rather than an automatic guarantee.", "sources": [{"file": "midterm-review.txt", "location": "Question 49"}]}, {"id": "Q050", "chapter": 3, "number": 50, "topic": "Debugging", "difficulty": "Review", "statement": "What does the term \"Chaos Engineering\" refer to in lab team exercises?", "options": ["Intentionally introducing controlled faults or bugs into codebases to test team resilience, debugging skills, and error handling", "Randomly deleting production databases without backups", "Writing code without using indentation or comments", "Refusing to use version control systems"], "answer": "A", "explanation": "Controlled fault injection exercises error handling and recovery. It should have defined scope and safeguards.", "sources": [{"file": "midterm-review.txt", "location": "Question 50"}]}, {"id": "Q051", "chapter": 3, "number": 51, "topic": "SPA navigation", "difficulty": "Review", "statement": "How does a client-side single-page application (SPA) handle navigation between views without full page reloads?", "options": ["By intercepting route changes and dynamically updating the DOM via JavaScript", "By requesting a complete HTML document from the server on every click", "By rebooting the browser session automatically", "By switching DNS server pointers instantly"], "answer": "A", "explanation": "Client-side routing responds to navigation by updating view state and the DOM, often using the History API.", "sources": [{"file": "midterm-review.txt", "location": "Question 51"}]}, {"id": "Q052", "chapter": 3, "number": 52, "topic": "Debugging", "difficulty": "Review", "statement": "What is a common symptom of an unhandled runtime error in browser JavaScript execution?", "options": ["The user interface freezes or behaves unexpectedly, accompanied by console error logs", "The computer monitor resolution changes automatically", "The domain registrar locks the DNS records", "The database triggers an automatic schema migration"], "answer": "A", "explanation": "A runtime error can interrupt the affected execution path and leave the UI incomplete or inconsistent. It does not necessarily freeze the entire browser.", "sources": [{"file": "midterm-review.txt", "location": "Question 52"}]}, {"id": "Q053", "chapter": 3, "number": 53, "topic": "JSON & APIs", "difficulty": "Review", "statement": "What is the function of the fetch() API in modern JavaScript?", "options": ["To make asynchronous HTTP requests to servers for sending or retrieving data", "To retrieve forgotten user passwords from local storage", "To download local font files for offline editing", "To scrape external websites without permission"], "answer": "A", "explanation": "fetch sends asynchronous HTTP requests and returns a Promise for a Response. HTTP error statuses such as 404 normally require checking response.ok.", "sources": [{"file": "midterm-review.txt", "location": "Question 53"}]}, {"id": "Q054", "chapter": 3, "number": 54, "topic": "TypeScript", "difficulty": "Review", "statement": "What does type safety in TypeScript provide compared to vanilla JavaScript?", "options": ["Compile-time error checking that catches type mismatches before code runs in production", "Guaranteed immunity against all cyber security vulnerabilities", "Automatic generation of database tables", "Elimination of the need for unit testing"], "answer": "A", "explanation": "TypeScript checks declared types before execution. Its types are erased and do not replace runtime validation of external data.", "sources": [{"file": "midterm-review.txt", "location": "Question 54"}]}, {"id": "Q055", "chapter": 3, "number": 55, "topic": "JavaScript syntax", "difficulty": "Review", "statement": "How are arrow functions syntactically distinguished in modern JavaScript?", "options": ["Using the function keyword followed by a name", "Using the fat arrow syntax (=>)", "Using the goto command statement", "Using class constructor wrappers"], "answer": "B", "explanation": "Arrow functions use => and capture this lexically. They differ from ordinary functions in more than spelling.", "sources": [{"file": "midterm-review.txt", "location": "Question 55"}]}, {"id": "Q056", "chapter": 3, "number": 56, "topic": "Browser storage", "difficulty": "Review", "statement": "What is local storage used for in web applications?", "options": ["Storing key-value pairs persistently in the browser across session reloads", "Storing private database administrator passwords securely on public servers", "Caching server-side routing tables for DNS resolution", "Executing backend SQL queries"], "answer": "A", "explanation": "localStorage persists string key-value data for an origin until cleared. It is accessible to page scripts and unsuitable for sensitive secrets.", "sources": [{"file": "midterm-review.txt", "location": "Question 56"}]}, {"id": "Q057", "chapter": 3, "number": 57, "topic": "Error handling", "difficulty": "Review", "statement": "What is the purpose of try...catch blocks in JavaScript error handling?", "options": ["To gracefully catch runtime exceptions and handle errors without crashing the application execution flow", "To encrypt user input before sending it across networks", "To automatically retry failed database connections indefinitely", "To test CSS media query breakpoints"], "answer": "A", "explanation": "try/catch handles exceptions in its protected execution. To catch a rejected Promise this way, await it inside the try block or attach an appropriate rejection handler.", "sources": [{"file": "midterm-review.txt", "location": "Question 57"}]}, {"id": "Q058", "chapter": 3, "number": 58, "topic": "DOM & events", "difficulty": "Review", "statement": "What does DOM manipulation refer to?", "options": ["Creating, modifying, or deleting HTML elements and attributes dynamically using scripts", "Changing physical hardware server components", "Configuring router firewall rules", "Writing SQL migration scripts"], "answer": "A", "explanation": "DOM manipulation changes document nodes or their attributes, allowing interfaces to react without a complete page reload.", "sources": [{"file": "midterm-review.txt", "location": "Question 58"}]}, {"id": "Q059", "chapter": 3, "number": 59, "topic": "Debugging", "difficulty": "Review", "statement": "Why is understanding stack traces critical when debugging JavaScript errors?", "options": ["They show the exact path of function calls leading up to an error, including file names and line numbers", "They list the exact credit card numbers stored in browser memory", "They calculate the speed of the internet connection", "They display the domain registration history"], "answer": "A", "explanation": "A stack trace identifies the chain of calls and source locations associated with an error, helping locate its cause.", "sources": [{"file": "midterm-review.txt", "location": "Question 59"}]}, {"id": "Q060", "chapter": 3, "number": 60, "topic": "Scope & closures", "difficulty": "Review", "statement": "What is a closure in JavaScript?", "options": ["A function bundled together with references to its lexical environment, allowing it to access outer scope variables even after the outer function has closed", "A command that shuts down the browser process", "A method for closing database connections safely", "An HTML tag used to close modal dialogs"], "answer": "A", "explanation": "A closure retains access to the lexical bindings around a function, even after the outer call has returned.", "sources": [{"file": "midterm-review.txt", "location": "Question 60"}]}, {"id": "Q061", "chapter": 4, "number": 61, "topic": "Relational databases", "difficulty": "Review", "statement": "What is PostgreSQL?", "options": ["An open-source, powerful object-relational database management system (ORDBMS)", "A front-end CSS framework for responsive buttons", "A client-side JavaScript testing library", "A domain name registrar service"], "answer": "A", "explanation": "PostgreSQL is an open-source object-relational database system. It stores and queries structured data and supports transactions and constraints.", "sources": [{"file": "midterm-review.txt", "location": "Question 61"}]}, {"id": "Q062", "chapter": 4, "number": 62, "topic": "CRUD & HTTP methods", "difficulty": "Review", "statement": "What does CRUD stand for in database and application operations?", "options": ["Create, Read, Update, Delete", "Compile, Route, Unpack, Deploy", "Connect, Replicate, Unlock, Debug", "Cache, Render, Upload, Download"], "answer": "A", "explanation": "CRUD groups four basic data operations: Create, Read, Update, and Delete.", "sources": [{"file": "midterm-review.txt", "location": "Question 62"}]}, {"id": "Q063", "chapter": 4, "number": 63, "topic": "Database security", "difficulty": "Review", "statement": "What is Row-Level Security (RLS) in database management?", "options": ["A security feature that restricts which database rows a user can read or write based on user authentication and policies", "A physical security guard stationed outside server rooms", "A firewall rule blocking inbound FTP traffic", "A method for encrypting CSS stylesheets"], "answer": "A", "explanation": "Row-Level Security policies control which rows are accessible for operations. Authentication and correct policy configuration are still needed; privileged roles can bypass RLS in some cases.", "sources": [{"file": "midterm-review.txt", "location": "Question 63"}]}, {"id": "Q064", "chapter": 4, "number": 64, "topic": "SQL injection", "difficulty": "Review", "statement": "What is the primary risk of SQL injection vulnerabilities in web applications?", "options": ["Attackers can manipulate input fields to execute arbitrary SQL queries, potentially bypassing authentication or accessing/deleting unauthorized database records", "The web server runs out of electrical power", "CSS stylesheets fail to render on mobile devices", "Domain names expire prematurely"], "answer": "A", "explanation": "SQL injection occurs when untrusted input changes a query's executable structure, potentially exposing or modifying data.", "sources": [{"file": "midterm-review.txt", "location": "Question 64"}]}, {"id": "Q065", "chapter": 4, "number": 65, "topic": "SQL injection", "difficulty": "Review", "statement": "How do parameterized queries or ORMs prevent SQL injection?", "options": ["By treating user input strictly as data parameters rather than executable SQL command syntax", "By deleting all user input containing punctuation marks", "By requiring two-factor authentication for every database read", "By encrypting the entire database with a single password"], "answer": "A", "explanation": "Bound parameters keep values separate from SQL structure. ORMs protect parameterized operations, but unsafe raw SQL or string concatenation can still introduce injection.", "sources": [{"file": "midterm-review.txt", "location": "Question 65"}]}, {"id": "Q066", "chapter": 4, "number": 66, "topic": "Routing & middleware", "difficulty": "Review", "statement": "What is the function of Express.js in Node.js backend development?", "options": ["A minimal and flexible web application framework that provides robust routing and middleware handling features", "A database indexing tool for unstructured text", "A front-end UI component library for React", "A DNS propagation testing utility"], "answer": "A", "explanation": "Express supplies routing and middleware on top of Node.js HTTP functionality. It is not a database or a frontend component library.", "sources": [{"file": "midterm-review.txt", "location": "Question 66"}]}, {"id": "Q067", "chapter": 4, "number": 67, "topic": "Schema & constraints", "difficulty": "Review", "statement": "What is a database schema?", "options": ["The formal structure and organization of a database, defining tables, fields, data types, and relationships", "A marketing plan for launching an e-commerce website", "A CSS stylesheet governing typography and colors", "A log file recording server error codes"], "answer": "A", "explanation": "A schema defines how data is organized: tables, columns, types, relationships, and constraints.", "sources": [{"file": "midterm-review.txt", "location": "Question 67"}]}, {"id": "Q068", "chapter": 4, "number": 68, "topic": "Configuration & secrets", "difficulty": "Review", "statement": "What is the purpose of an environment variable (.env file) in backend applications?", "options": ["To store configuration settings and secret credentials (like database connection strings and API keys) separately from source code", "To define CSS media query breakpoints for mobile responsiveness", "To store public user profile pictures", "To manage HTML document outlines"], "answer": "A", "explanation": "Backend environment configuration separates deployment values and secrets from tracked application code. Never commit real secrets or ship them in frontend bundles.", "sources": [{"file": "midterm-review.txt", "location": "Question 68"}]}, {"id": "Q069", "chapter": 4, "number": 69, "topic": "Authentication & authorization", "difficulty": "Review", "statement": "What does API authentication ensure in client-server communications?", "options": ["That requests originate from verified, authorized users or systems possessing valid credentials or tokens", "That web pages load in under one second", "That database tables contain no duplicate rows", "That CSS stylesheets are fully minified"], "answer": "A", "explanation": "Authentication verifies identity using credentials or tokens. The intended answer is A, but authorization is the separate check of what that identity may do.", "sources": [{"file": "midterm-review.txt", "location": "Question 69"}]}, {"id": "Q070", "chapter": 4, "number": 70, "topic": "Schema & constraints", "difficulty": "Review", "statement": "What is a relational database foreign key?", "options": ["A field (or collection of fields) in one table that uniquely identifies a row of another table, establishing a link between them", "An encrypted password stored in local storage", "A backup server located in an external data center", "A temporary cookie used for session tracking"], "answer": "A", "explanation": "A foreign key references a primary or other unique key to enforce relationships. Foreign key values may repeat in the referencing table, as in many orders belonging to one customer.", "sources": [{"file": "midterm-review.txt", "location": "Question 70"}]}, {"id": "Q071", "chapter": 4, "number": 71, "topic": "Routing & middleware", "difficulty": "Review", "statement": "What is middleware in Express.js applications?", "options": ["Functions that have access to the request and response objects, used to execute tasks like authentication checks, logging, and body parsing", "Physical cables connecting routers to servers", "CSS layout wrappers for centering grid items", "Database backup routines executed weekly"], "answer": "A", "explanation": "Middleware functions participate in the request-response cycle. They can inspect or change requests, send a response, or pass control onward.", "sources": [{"file": "midterm-review.txt", "location": "Question 71"}]}, {"id": "Q072", "chapter": 4, "number": 72, "topic": "Database indexing", "difficulty": "Review", "statement": "What is the purpose of database indexing?", "options": ["To significantly speed up data retrieval operations on database tables at the cost of slight storage and write overhead", "To encrypt all columns against unauthorized viewing", "To automatically delete obsolete log files", "To organize HTML heading tags hierarchically"], "answer": "A", "explanation": "Indexes help locate rows efficiently, at the cost of storage and maintenance during writes. Their benefit depends on the query and data.", "sources": [{"file": "midterm-review.txt", "location": "Question 72"}]}, {"id": "Q073", "chapter": 4, "number": 73, "topic": "CRUD & HTTP methods", "difficulty": "Review", "statement": "What is an HTTP POST request typically used for in RESTful APIs?", "options": ["Creating a new resource or submitting data to a server endpoint", "Retrieving a static image file from a CDN", "Deleting an existing database record", "Checking if a server is online (ping)"], "answer": "A", "explanation": "POST typically submits data for processing or creates a resource. It is not inherently idempotent.", "sources": [{"file": "midterm-review.txt", "location": "Question 73"}]}, {"id": "Q074", "chapter": 4, "number": 74, "topic": "CRUD & HTTP methods", "difficulty": "Review", "statement": "What is an HTTP GET request used for?", "options": ["Requesting data or resource representation from a server without modifying server state", "Submitting credit card payment details for permanent storage", "Updating user profile passwords", "Terminating active session tokens"], "answer": "A", "explanation": "GET retrieves a representation and is defined to have safe semantics. It should not be used for requested state-changing operations.", "sources": [{"file": "midterm-review.txt", "location": "Question 74"}]}, {"id": "Q075", "chapter": 4, "number": 75, "topic": "Transport security", "difficulty": "Review", "statement": "Why is HTTPS encryption essential for transmitting API tokens and passwords?", "options": ["It prevents eavesdropping and man-in-the-middle attacks from intercepting sensitive credentials in plain text across networks", "It speeds up database query execution times", "It eliminates the need for database indexing", "It ensures all users have modern web browsers"], "answer": "A", "explanation": "TLS protects credentials in transit against passive interception and helps authenticate the server. It does not secure compromised endpoints.", "sources": [{"file": "midterm-review.txt", "location": "Question 75"}]}, {"id": "Q076", "chapter": 4, "number": 76, "topic": "Normalization", "difficulty": "Review", "statement": "What does database normalization aim to achieve?", "options": ["Reducing data redundancy and improving data integrity by organizing tables and relationships systematically", "Maximizing duplicate records to improve fault tolerance", "Compressing database files into zip archives", "Eliminating the need for SQL queries entirely"], "answer": "A", "explanation": "Normalization organizes related facts to reduce duplication and update anomalies while preserving data integrity.", "sources": [{"file": "midterm-review.txt", "location": "Question 76"}]}, {"id": "Q077", "chapter": 4, "number": 77, "topic": "Schema & constraints", "difficulty": "Review", "statement": "What is a primary key in a relational database table?", "options": ["A unique identifier for each record in a table that ensures every row can be uniquely identified and cannot contain null values", "The password used by database administrators", "The first column listed in an HTML table", "An external API token used for payment gateways"], "answer": "A", "explanation": "A primary key uniquely identifies each row and is non-null. It may consist of one column or several columns.", "sources": [{"file": "midterm-review.txt", "location": "Question 77"}]}, {"id": "Q078", "chapter": 4, "number": 78, "topic": "API security", "difficulty": "Review", "statement": "What is rate limiting used for in API security?", "options": ["Restricting the number of requests a user or IP address can make to an API within a specified time window to prevent abuse or DDoS attacks", "Slowing down database queries to save electricity", "Limiting the number of CSS files a browser can download", "Controlling employee login hours"], "answer": "A", "explanation": "Rate limits cap requests within a window to reduce abuse and overload. They are one layer of defense and do not stop every denial-of-service attack.", "sources": [{"file": "midterm-review.txt", "location": "Question 78"}]}, {"id": "Q079", "chapter": 4, "number": 79, "topic": "API endpoints", "difficulty": "Review", "statement": "What is an API endpoint?", "options": ["A specific URL path where an API accepts requests and interacts with client applications", "The physical power button on a cloud server rack", "A DNS record pointing to a mail server", "A CSS class for styling buttons"], "answer": "A", "explanation": "An API endpoint is an address at which a service exposes an operation or resource, commonly combined with an HTTP method.", "sources": [{"file": "midterm-review.txt", "location": "Question 79"}]}, {"id": "Q080", "chapter": 4, "number": 80, "topic": "Transactions", "difficulty": "Review", "statement": "What is database transaction atomicity (the 'A' in ACID properties)?", "options": ["Ensuring that all operations within a transaction complete successfully as a single unit, or none of them apply (all-or-nothing execution)", "Splitting database tables across multiple global regions", "Encrypting database backups automatically", "Automatically scaling server CPU cores"], "answer": "A", "explanation": "Atomicity makes a transaction all-or-nothing. For example, an order insertion and inventory update can commit together or roll back together.", "sources": [{"file": "midterm-review.txt", "location": "Question 80"}]}, {"id": "Q081", "chapter": 5, "number": 81, "topic": "Git fundamentals", "difficulty": "Review", "statement": "What is the primary purpose of Git in software development workflows?", "options": ["Distributed version control for tracking code changes, managing branches, and coordinating team collaboration", "Compiling TypeScript code into production binaries", "Hosting relational PostgreSQL databases in cloud environments", "Testing web page accessibility against WCAG standards"], "answer": "A", "explanation": "Git tracks versions as a distributed repository, supporting local history and collaborative branching and merging.", "sources": [{"file": "midterm-review.txt", "location": "Question 81"}]}, {"id": "Q082", "chapter": 5, "number": 82, "topic": "Git fundamentals", "difficulty": "Review", "statement": "What is a Git commit?", "options": ["A saved snapshot of changes made to files in the repository, accompanied by a descriptive commit message", "A live server deployment on Vercel", "An automated security audit report", "A database backup archive"], "answer": "A", "explanation": "A commit records a repository snapshot plus metadata, including a message and links to its parent commits.", "sources": [{"file": "midterm-review.txt", "location": "Question 82"}]}, {"id": "Q083", "chapter": 5, "number": 83, "topic": "Branches & pull requests", "difficulty": "Review", "statement": "Why is branching important in Git-based team development?", "options": ["It allows developers to work on new features, bug fixes, or experiments in isolated environments without disrupting the main production branch", "It automatically encrypts source code against hacking", "It eliminates the need for code review pull requests", "It speeds up DNS propagation times"], "answer": "A", "explanation": "Branches provide separate lines of development so changes can be prepared and reviewed before integration.", "sources": [{"file": "midterm-review.txt", "location": "Question 83"}]}, {"id": "Q084", "chapter": 5, "number": 84, "topic": "Branches & pull requests", "difficulty": "Review", "statement": "What is a Pull Request (PR) used for in GitHub workflows?", "options": ["Proposing changes from a feature branch to be reviewed, discussed, and merged into the main codebase branch", "Pulling database records from a remote server", "Downloading Node.js dependencies via npm install", "Resetting local repository commit histories"], "answer": "A", "explanation": "A pull request proposes integrating changes and provides a place for discussion, review, and automated checks.", "sources": [{"file": "midterm-review.txt", "location": "Question 84"}]}, {"id": "Q085", "chapter": 5, "number": 85, "topic": "Repository hygiene", "difficulty": "Review", "statement": "What is the function of a .gitignore file in a Git repository?", "options": ["Specifying intentionally untracked files and directories (like .env secrets, node_modules, and build caches) that Git should ignore", "Ignoring syntax errors in JavaScript files automatically", "Blocking unauthorized users from viewing public repositories", "Disabling CSS stylesheets during testing"], "answer": "A", "explanation": ".gitignore excludes matching untracked files from normal tracking. It does not remove secrets or files already committed; leaked secrets must be rotated.", "sources": [{"file": "midterm-review.txt", "location": "Question 85"}]}, {"id": "Q086", "chapter": 5, "number": 86, "topic": "Continuous integration", "difficulty": "Review", "statement": "What does Continuous Integration (CI) automate in software pipelines?", "options": ["Automatically running build tests, linting, and verification checks whenever new code is pushed or pulled into repository branches", "Automatically purchasing domain names from registrars", "Automatically grading student assignments in Canvas", "Automatically generating marketing copy using AI"], "answer": "A", "explanation": "CI runs automated verification when changes are integrated or proposed. It can include builds, tests, and static analysis.", "sources": [{"file": "midterm-review.txt", "location": "Question 86"}]}, {"id": "Q087", "chapter": 5, "number": 87, "topic": "Commits & reviews", "difficulty": "Review", "statement": "Why are meaningful, atomic Git commit messages important?", "options": ["They provide a clear, traceable history of why and how changes were made, facilitating code audits and debugging", "They increase the execution speed of JavaScript runtime engines", "They satisfy database normalization rules", "They automatically generate CSS stylesheets"], "answer": "A", "explanation": "Small focused commits with descriptive messages explain intent and make review, debugging, and reverting easier.", "sources": [{"file": "midterm-review.txt", "location": "Question 87"}]}, {"id": "Q088", "chapter": 5, "number": 88, "topic": "Commits & reviews", "difficulty": "Review", "statement": "What is code review in professional software engineering teams?", "options": ["Peer evaluation of pull requests to catch bugs, ensure adherence to coding standards, verify security, and share knowledge", "Testing web page color contrast ratios for accessibility", "Checking student attendance in classroom lectures", "Measuring server CPU utilization under load"], "answer": "A", "explanation": "Code review lets peers inspect correctness, security, maintainability, and consistency while sharing knowledge.", "sources": [{"file": "midterm-review.txt", "location": "Question 88"}]}, {"id": "Q089", "chapter": 5, "number": 89, "topic": "Documentation", "difficulty": "Review", "statement": "What is the purpose of a project README.md file in a repository root?", "options": ["Documenting project overview, setup instructions, architecture details, and usage guides for collaborators and evaluators", "Storing private API keys and database credentials", "Logging browser console error stack traces", "Defining CSS grid layout templates"], "answer": "A", "explanation": "A README gives collaborators an entry point for understanding, setting up, and using a project.", "sources": [{"file": "midterm-review.txt", "location": "Question 89"}]}, {"id": "Q090", "chapter": 5, "number": 90, "topic": "Release management", "difficulty": "Review", "statement": "What is software release management?", "options": ["The process of planning, scheduling, testing, and deploying software builds from development environments into stable production releases", "Managing customer support email inquiries", "Registering trademarks for business brand assets", "Backing up local hard drives weekly"], "answer": "A", "explanation": "Release management coordinates how tested changes are packaged, scheduled, deployed, and maintained in production.", "sources": [{"file": "midterm-review.txt", "location": "Question 90"}]}, {"id": "Q091", "chapter": 5, "number": 91, "topic": "Capstone governance", "difficulty": "Review", "statement": "What is the significance of the Final Capstone project in CIS 3610?", "options": ["Demonstrating comprehensive mastery by designing, building, securing, and deploying a fully functional full-stack e-commerce or business web application", "Memorizing SQL syntax rules for a written test", "Submitting a single HTML file with no styling or backend", "Reviewing textbook chapters without writing code"], "answer": "A", "explanation": "The supplied review describes the capstone as an end-to-end demonstration of full-stack business application skills. Use the actual assignment rubric for grading requirements.", "sources": [{"file": "midterm-review.txt", "location": "Question 91"}]}, {"id": "Q092", "chapter": 5, "number": 92, "topic": "Code quality", "difficulty": "Review", "statement": "What is the purpose of code linting tools (such as ESLint or Prettier)?", "options": ["Automatically analyzing code for stylistic errors, syntax problems, and formatting inconsistencies to maintain code quality", "Encrypting database tables against SQL injection", "Monitoring live server traffic for DDoS attacks", "Compiling TypeScript files into binary machine code"], "answer": "A", "explanation": "Linting checks source for likely problems and conventions; formatting tools such as Prettier focus on consistent presentation. The intended combined choice is A.", "sources": [{"file": "midterm-review.txt", "location": "Question 92"}]}, {"id": "Q093", "chapter": 5, "number": 93, "topic": "Project management", "difficulty": "Review", "statement": "What is an issue tracker (like GitHub Issues) used for in project management?", "options": ["Creating, assigning, tracking, and prioritizing tasks, bug reports, and feature requests throughout the development lifecycle", "Storing encrypted user passwords and session tokens", "Managing DNS domain registrar renewals", "Hosting relational PostgreSQL databases"], "answer": "A", "explanation": "An issue tracker records work items, ownership, priorities, and status through the project lifecycle.", "sources": [{"file": "midterm-review.txt", "location": "Question 93"}]}, {"id": "Q094", "chapter": 5, "number": 94, "topic": "Team accountability", "difficulty": "Review", "statement": "Why is peer accountability and transparent contribution tracking essential in team lab projects?", "options": ["It ensures all team members contribute equitably, allows verifiable attribution of commits and reviews, and mirrors professional engineering standards", "It prevents Git repositories from exceeding storage limits", "It eliminates the need for database backups", "It automates CSS stylesheet compilation"], "answer": "A", "explanation": "Traceable contributions and reviews help teams distribute work fairly and demonstrate individual participation.", "sources": [{"file": "midterm-review.txt", "location": "Question 94"}]}, {"id": "Q095", "chapter": 5, "number": 95, "topic": "Release management", "difficulty": "Review", "statement": "What is a software release tag in Git?", "options": ["A specific pointer referencing a particular commit milestone (e.g., v1.0.0) used to mark stable production releases", "An HTML tag used for formatting text headers", "A security badge displayed on website footers", "A database foreign key constraint"], "answer": "A", "explanation": "A Git tag gives a stable name to a particular object, usually a commit marking a release milestone.", "sources": [{"file": "midterm-review.txt", "location": "Question 95"}]}, {"id": "Q096", "chapter": 5, "number": 96, "topic": "Capstone governance", "difficulty": "Review", "statement": "What is the primary objective of the Final Defense and Individual Reflection?", "options": ["Defending technical architecture decisions, demonstrating live system functionality, and reflecting on AI engineering collaboration and lessons learned", "Taking a 100-question multiple-choice exam without code", "Designing a corporate logo in Figma", "Registering a business LLC in California"], "answer": "A", "explanation": "The supplied review frames the defense and reflection around technical choices, a working demonstration, and lessons from AI-assisted development.", "sources": [{"file": "midterm-review.txt", "location": "Question 96"}]}, {"id": "Q097", "chapter": 5, "number": 97, "topic": "Repository hygiene", "difficulty": "Review", "statement": "What does workflow hygiene entail in professional software development repositories?", "options": ["Maintaining clean commit logs, descriptive branch names, organized file structures, and zero exposed credentials", "Deleting repository history after every sprint", "Writing all code in a single unformatted file", "Ignoring compiler warnings and error messages"], "answer": "A", "explanation": "Workflow hygiene includes clear organization, readable history, useful branch names, and keeping credentials out of version control.", "sources": [{"file": "midterm-review.txt", "location": "Question 97"}]}, {"id": "Q098", "chapter": 5, "number": 98, "topic": "Automated testing", "difficulty": "Review", "statement": "How does automated testing (unit and integration tests) contribute to software quality?", "options": ["By automatically verifying that code components function correctly and catching regressions when changes are made", "By generating AI marketing copy for e-commerce products", "By configuring DNS A and CNAME records", "By designing accessible color contrast palettes"], "answer": "A", "explanation": "Automated tests check expected behavior repeatedly and detect regressions. Test quality and coverage determine which problems they can catch.", "sources": [{"file": "midterm-review.txt", "location": "Question 98"}]}, {"id": "Q099", "chapter": 5, "number": 99, "topic": "Documentation", "difficulty": "Review", "statement": "What is the role of technical documentation in full-stack project development?", "options": ["Explaining system architecture, API endpoints, setup procedures, and operational runbooks for future maintainers and stakeholders", "Replacing comments inside JavaScript functions", "Storing credit card numbers securely", "Automating Git branch merges"], "answer": "A", "explanation": "Documentation explains how the system is structured, used, deployed, and maintained so future contributors can work effectively.", "sources": [{"file": "midterm-review.txt", "location": "Question 99"}]}, {"id": "Q100", "chapter": 5, "number": 100, "topic": "Iterative delivery", "difficulty": "Review", "statement": "Why is iterative development and agile milestone planning emphasized over monolithic end-of-term crunches?", "options": ["It allows continuous feedback, early risk identification, steady progress tracking, and higher quality final deliverables", "It eliminates the need for version control systems", "It allows students to skip lab assignments entirely", "It guarantees zero bugs in production code"], "answer": "A", "explanation": "Incremental delivery exposes risks earlier and enables feedback and verification throughout development, reducing last-minute integration surprises.", "sources": [{"file": "midterm-review.txt", "location": "Question 100"}]}]</script>
<script id="essay-data" type="application/json">[{"id": "E01", "chapter": 1, "title": "Architectural Trade-offs", "prompt": "Compare and contrast monolithic web architectures with headless CMS architectures. Discuss how decoupling the frontend user interface from backend services impacts scalability, deployment workflows, and enterprise infrastructure management.", "points": ["A monolith couples presentation and backend behavior in one deployable application; a headless CMS exposes managed content through APIs to separate frontends.", "Decoupling allows independent frontend deployments, reuse across channels, and separate scaling of services.", "Trade-offs include API latency, authentication, versioning, preview tooling, caching, monitoring, and more deployment coordination."], "example": "A retailer could deliver the same catalog to a website and mobile app through a content API. The web team can deploy a new storefront independently, but it must coordinate API contracts and caching with the backend team. A small single-channel team might prefer a monolith for simpler operations."}, {"id": "E02", "chapter": 1, "title": "Infrastructure Security & Configuration", "prompt": "Explain why separating environment configuration (.env files and credentials) from source code is critical in modern web deployment. Describe the security risks associated with exposing secret tokens or database strings in public repositories and how continuous deployment platforms (e.g., Vercel, Netlify) handle these variables safely.", "points": ["Keep configuration separate from application logic and use different values per environment.", "Public secrets can permit unauthorized data access, resource abuse, or account compromise; removing a file does not remove Git history. Revoke and rotate exposed credentials.", "Configure deployment variables in the platform's project/environment settings and restrict access. A .env file is a convenience, not encryption.", "Only server-side secrets remain secret. Values compiled into browser code or deliberately marked public are visible to visitors."], "example": "Store a database connection string in the deployment platform's server environment, read it in backend code, and ignore local .env files in Git. Commit only a .env.example with placeholders. If a credential leaks, rotate it before cleaning the repository history."}, {"id": "E03", "chapter": 2, "title": "Semantic Markup vs. Generic Wrappers", "prompt": "Discuss the technical and accessibility implications of utilizing semantic HTML5 elements (<header>, <nav>, <main>, <footer>) instead of generic <div> wrappers. How do these tags affect screen readers, search engine crawlers, and long-term code maintainability?", "points": ["header, nav, main, and footer communicate document roles; div is a generic container without those default semantics.", "Landmarks and a logical heading hierarchy help screen reader users find content and understand structure.", "Semantic structure can help crawlers interpret a page, though it does not guarantee a ranking increase.", "Meaningful markup makes maintenance easier; semantic tags still need correct labels, nesting, and keyboard behavior."], "example": "Wrap the site's primary links in nav and its unique page content in main. A screen reader user can jump directly to the main landmark, and another developer can identify the navigation without reverse-engineering CSS class names."}, {"id": "E04", "chapter": 2, "title": "Digital Accessibility & WCAG Compliance", "prompt": "Detail the principles of Web Content Accessibility Guidelines (WCAG) Level AA compliance. Choose two distinct accessibility requirements—such as color contrast ratios or keyboard navigation support (Tab indexing)—and analyze how failing to meet them impacts users with visual or motor impairments.", "points": ["WCAG is organized around perceivable, operable, understandable, and robust content. AA conformance includes applicable A and AA success criteria.", "Normal text generally needs at least 4.5:1 contrast; large text needs 3:1. Low contrast can obscure instructions for users with low vision.", "All functionality must be keyboard operable with logical focus order and no keyboard trap. Provide visible focus and use native controls; avoid positive tabindex values.", "Mouse-only menus can block users with motor impairments from completing tasks. Test contrast, Tab/Shift+Tab, Enter/Space, and applicable arrow-key patterns."], "example": "A checkout with faint labels and a mouse-only payment button can exclude users. Increase label contrast, use a native button, preserve visible focus, and verify that the entire checkout can be completed with a keyboard."}, {"id": "E05", "chapter": 3, "title": "Asynchronous JavaScript Execution", "prompt": "Explain the role of Promises and Async/Await syntax in modern client-side JavaScript. Contrast asynchronous API data fetching with synchronous execution blocking, and explain how unhandled promise rejections or runtime errors impact single-page application (SPA) performance.", "points": ["Promises represent pending, fulfilled, or rejected asynchronous results. An async function returns a Promise, and await pauses that function until settlement.", "Awaiting network I/O allows the event loop to handle other work; blocking synchronous execution or long CPU tasks can make interaction unresponsive.", "Use try/catch around awaited requests, check HTTP response status, and present loading and error states.", "Unhandled failures may leave a view stale or stuck in loading; they do not necessarily freeze the entire SPA. Handle errors and cleanup deliberately."], "example": "An async product loader sets a loading state, awaits fetch, checks response.ok, and parses JSON. Its catch shows a retry message and its finally clears loading. A synchronous blocking request would prevent normal interaction while waiting."}, {"id": "E06", "chapter": 3, "title": "DOM Manipulation & Client-Side Validation", "prompt": "Analyze the Document Object Model (DOM) and how JavaScript event listeners dynamically alter web pages without requiring full browser reloads. Furthermore, evaluate why client-side input validation is useful for user experience but fundamentally insufficient as a standalone security measure.", "points": ["The DOM is a tree representation of the document that JavaScript can inspect and modify.", "Event listeners respond to user or browser events by changing state, elements, text, or attributes without a full navigation.", "Client validation gives quick feedback and reduces accidental bad input, but browser code and requests are under user control.", "Revalidate on the server, enforce authorization, use parameterized database operations, and safely render untrusted content."], "example": "A submit listener checks whether a quantity is a positive integer and displays an inline error. An attacker can bypass the form, so the order endpoint must independently validate quantity and confirm that the authenticated user can place the order."}, {"id": "E07", "chapter": 4, "title": "Relational Database Integrity & ACID Principles", "prompt": "Explain the concept of database transaction atomicity (the 'A' in ACID properties) within a relational database management system like PostgreSQL. Why are relational constraints (such as primary keys and foreign keys) critical for preventing data corruption in an e-commerce backend?", "points": ["Atomicity means all operations in a transaction commit together or none take effect; an error can trigger rollback.", "In an order transaction, creating the order and updating stock must not leave a partial result.", "Primary keys uniquely identify non-null records. Foreign keys enforce references to existing related keys.", "Constraints, appropriate isolation/locking, and transaction boundaries work together. Atomicity alone does not enforce every business rule or prevent concurrent overselling."], "example": "Begin a transaction, insert an order, insert its line items referencing valid products, and decrement available stock with a suitable concurrency check. If any step fails, roll back. Foreign keys prevent a line item from referring to a nonexistent order or product."}, {"id": "E08", "chapter": 4, "title": "OWASP Top 10", "prompt": "Mitigating SQL Injection: Define SQL injection vulnerabilities and the risks they pose to backend data integrity. Explain the technical mechanism by which parameterized queries and ORMs protect web applications from malicious input manipulation.", "points": ["SQL injection occurs when attacker-controlled text becomes part of executable SQL structure.", "Possible consequences include authentication bypass and unauthorized reads, writes, or deletion, limited by the database account's privileges.", "Parameterized statements send SQL structure and bound values separately, so input is interpreted as data.", "ORM parameter binding can help, but concatenated raw queries remain vulnerable. Dynamic identifiers require allow-listing; also use least privilege."], "example": "Use a query such as SELECT * FROM users WHERE email = $1 with the email supplied as a separate parameter. Input containing SQL punctuation stays one value. Do not construct the query by concatenating that email into the SQL text."}, {"id": "E09", "chapter": 5, "title": "Distributed Version Control & Branching Strategies", "prompt": "Describe how Git branching and Pull Request (PR) workflows facilitate collaborative full-stack development. Discuss the importance of descriptive, atomic commit messages and code peer reviews in maintaining repository health and minimizing production bugs.", "points": ["Branches isolate focused changes; pull requests propose merging them into an integration branch.", "Use small commits with messages explaining intent so reviewers can understand, trace, revert, or bisect changes.", "Peer review checks correctness, security, tests, and maintainability while sharing knowledge.", "Run CI checks before merging and resolve conflicts deliberately; branching alone does not guarantee correctness."], "example": "Build a checkout validation fix on a feature branch, add a focused regression test, and open a PR describing the bug and behavior change. A teammate reviews it and CI runs before merge, reducing the chance of breaking the main branch."}, {"id": "E10", "chapter": 5, "title": "Iterative Development vs. Monolithic Delivery", "prompt": "Reflect on the principles of agile milestone planning and continuous integration (CI) pipelines in the context of your capstone project. Why is iterative, incremental building preferred over end-of-term monolithic crunches for complex web applications?", "points": ["Plan small milestones that each produce a working increment and invite feedback.", "CI builds and checks integrated changes frequently, exposing regressions and integration problems early.", "Deliver core behavior first, then strengthen accessibility, security, and deployment through successive milestones.", "A final crunch delays feedback and creates concentrated integration risk. Iteration improves visibility but does not guarantee zero defects."], "example": "For a storefront capstone, first deploy a catalog, then add a validated cart, then transactional order creation, and finally security and accessibility improvements. Each milestone includes review and CI so problems surface while there is time to correct them."}]</script>

 const cards={};if(raw.cards&&typeof raw.cards==='object')for(const [id,v] of Object.entries(raw.cards))if(BY_ID.has(id)&&(v==='known'||v==='learning'))cards[id]=v;

function balanced(pool,n,r=Math.random){
 const groups=[...new Set(pool.map(q=>q.chapter))].sort().map(c=>shuffled(pool.filter(q=>q.chapter===c),r));const result=[];let turn=shuffled(groups.map((_,i)=>i),r);

function savedTests(chapters){

 });
