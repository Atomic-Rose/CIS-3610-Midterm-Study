  --accent:#4F46E5;--accent-soft:#EEF0FF;
  --flag:#D97706;
  --correct:#0F9D6E;--correct-soft:#E7F7F0;
  --incorrect:#DC2626;--incorrect-soft:#FDECEC;
  /* Text on a solid accent fill: white passes AA in light (6.29:1). */
  --on-accent:var(--surface);
  --shadow:0 1px 2px rgb(15 23 42/.04),0 2px 8px rgb(15 23 42/.04);
  --shadow-raised:0 2px 4px rgb(15 23 42/.05),0 8px 24px rgb(15 23 42/.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F19;--surface:#121826;--surface-2:#1A2132;--border:#273042;
    --text:#E6E9F0;--text-muted:#9AA3B5;
    --accent:#818CF8;--accent-soft:#1E2240;
    --flag:#F59E0B;
    --correct:#34D399;--correct-soft:#0F2A22;
    --incorrect:#F87171;--incorrect-soft:#2D1416;
    /* White on #818CF8 is only 2.98:1, so dark mode uses the ink background (6.42:1). */
    --on-accent:var(--bg);
    --shadow:0 1px 2px rgb(0 0 0/.3);
    --shadow-raised:0 4px 16px rgb(0 0 0/.35);
    color-scheme:dark;
  }
}
[data-theme="dark"]{
  --bg:#0B0F19;--surface:#121826;--surface-2:#1A2132;--border:#273042;
  --text:#E6E9F0;--text-muted:#9AA3B5;
  --accent:#818CF8;--accent-soft:#1E2240;
  --flag:#F59E0B;
  --correct:#34D399;--correct-soft:#0F2A22;
  --incorrect:#F87171;--incorrect-soft:#2D1416;
  --on-accent:var(--bg);
  --shadow:0 1px 2px rgb(0 0 0/.3);
  --shadow-raised:0 4px 16px rgb(0 0 0/.35);
  color-scheme:dark;
}
:root{
  /* Type */
  --font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
  --text-xs:12px;--text-sm:14px;--text-md:16px;--text-lg:18px;--text-xl:22px;--text-2xl:28px;--text-3xl:clamp(32px,4.2vw,44px);
  --leading-tight:1.2;--leading-body:1.6;
  --tracking-tight:-0.02em;--tracking-caps:0.08em;
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
  /* 8px spacing scale */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  /* Shape */
  --radius-sm:6px;--radius:8px;--radius-card:12px;--radius-pill:999px;
  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
  /* Motion: short and calm */

  --content-width:1200px;
}

/* Ink & Signal components. Uses only the variables in tokens.css. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--weight-regular) var(--text-md)/var(--leading-body) var(--font-sans);
  font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;transition:background-color var(--duration) var(--ease),color var(--duration) var(--ease)}
h1,h2,h3{margin:0;font-weight:var(--weight-bold);line-height:var(--leading-tight);letter-spacing:var(--tracking-tight)}
h1{font-size:var(--text-3xl)}
h2{font-size:var(--text-xl);font-weight:var(--weight-semibold)}

.num{font-variant-numeric:tabular-nums}
.eyebrow{font:var(--weight-semibold) var(--text-xs)/1.4 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm)}
::selection{background:var(--accent-soft);color:var(--text)}

/* Buttons */
.btn,button{font:var(--weight-semibold) var(--text-sm)/1.2 var(--font-sans);color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px var(--space-4);min-height:40px;cursor:pointer;white-space:nowrap;
  transition:background-color var(--duration) var(--ease),border-color var(--duration) var(--ease),color var(--duration) var(--ease),box-shadow var(--duration) var(--ease)}
.btn:hover:not(:disabled),button:hover:not(:disabled),.btn.is-hover{background:var(--surface-2)}
.btn:focus-visible,button:focus-visible{box-shadow:var(--focus-ring);border-radius:var(--radius)}
.btn:disabled,button:disabled{cursor:not-allowed;color:var(--text-muted);background:var(--surface-2);border-color:var(--border);opacity:.7}
.btn-primary,button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled),button.primary:hover:not(:disabled),.btn-primary.is-hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.btn-primary:disabled,button.primary:disabled{background:var(--surface-2);border-color:var(--border);color:var(--text-muted)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover:not(:disabled),.btn-ghost.is-hover{background:var(--surface-2)}
.btn[aria-pressed="true"],.btn.is-selected{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.btn-sm,button.small{min-height:32px;padding:6px var(--space-3);font-size:13px}

/* Answer buttons: neutral until submitted; selection uses accent only. */
.answer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin:var(--space-5) 0}
.answer{display:flex;align-items:center;justify-content:center;gap:var(--space-3);min-height:64px;font-size:var(--text-lg);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.answer[aria-pressed="true"],.answer.is-selected{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
.answer kbd{font-size:11px;font-weight:var(--weight-medium);color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 6px}
.answer[aria-pressed="true"] kbd{border-color:var(--accent)}
/* After checking (feedback modes only): the right answer and a wrong pick. Text stays ink; color is the border, fill, and mark. */
.answer.is-correct,.answer.is-correct:disabled{border-color:var(--correct);background:var(--correct-soft);box-shadow:inset 0 0 0 1px var(--correct);color:var(--text);opacity:1}
.answer.is-incorrect,.answer.is-incorrect:disabled{border-color:var(--incorrect);background:var(--incorrect-soft);box-shadow:inset 0 0 0 1px var(--incorrect);color:var(--text);opacity:1}
.answer .mark{font-weight:var(--weight-bold)}
.answer.is-correct .mark{color:var(--correct)}
.answer.is-incorrect .mark{color:var(--incorrect)}
.nw{white-space:nowrap}

/* Cards and chips */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:var(--space-5)}
.chip{display:inline-flex;align-items:center;gap:6px;font:var(--weight-medium) var(--text-xs)/1 var(--font-sans);color:var(--text-muted);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:5px 10px}
.chip.accent{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.flag::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--flag)}
.qid{font:var(--weight-regular) var(--text-xs)/1 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.statement{font-size:clamp(18px,2.1vw,21px);line-height:1.6;font-weight:var(--weight-medium);letter-spacing:-0.005em;margin:var(--space-4) 0 var(--space-2);overflow-wrap:anywhere}

/* Progress */
.progress{height:4px;background:var(--surface-2);border-radius:var(--radius-pill);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width 200ms var(--ease)}
progress.progress{appearance:none;-webkit-appearance:none;width:100%;border:0;display:block;color:var(--accent);accent-color:var(--accent)}
progress.progress::-webkit-progress-bar{background:var(--surface-2);border-radius:var(--radius-pill)}
progress.progress::-webkit-progress-value{background:var(--accent);border-radius:var(--radius-pill);transition:width 200ms var(--ease)}
progress.progress::-moz-progress-bar{background:var(--accent);border-radius:var(--radius-pill)}

/* Feedback: color appears only here, as a bar and an icon; text stays ink for contrast. */
.feedback{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--space-5) var(--space-5) var(--space-5) calc(var(--space-5) + 4px);overflow:hidden}
.feedback::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--correct)}
.feedback.incorrect::before{background:var(--incorrect)}
.feedback-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)}
.feedback-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-pill);background:var(--correct-soft);color:var(--correct);font-weight:var(--weight-bold);flex:none}
.feedback.incorrect .feedback-icon{background:var(--incorrect-soft);color:var(--incorrect)}
.feedback-head h3{font-size:var(--text-lg)}
.answerline{font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-4)}
.answerline strong{color:var(--text)}
.feedback h4{margin:var(--space-4) 0 var(--space-1);font:var(--weight-semibold) 13px/1.4 var(--font-sans);color:var(--text-muted)}
.feedback p{margin:0 0 var(--space-2)}
.correction{background:var(--surface-2);border-radius:var(--radius);padding:var(--space-3) var(--space-4)}
.steps,pre{font:var(--weight-regular) 13px/1.75 var(--font-mono);background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--space-3) var(--space-4);margin:var(--space-2) 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:var(--space-4) var(--space-5)}
.stat b{display:block;font-size:var(--text-2xl);font-weight:var(--weight-bold);letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{display:block;font-size:13px;color:var(--text-muted);margin-top:2px}
.stat .progress{margin-top:var(--space-3)}

/* Chapter cards: the whole card is the control. */
.chapter{position:relative;display:block;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--space-4);
  transition:border-color var(--duration) var(--ease),background-color var(--duration) var(--ease),box-shadow var(--duration) var(--ease)}
.chapter:hover{border-color:var(--text-muted)}
.chapter input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chapter .check{position:absolute;top:var(--space-3);right:var(--space-3);display:grid;place-items:center;width:20px;height:20px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:transparent;font-size:12px;font-weight:var(--weight-bold);transition:all var(--duration) var(--ease)}
.chapter:has(input:checked),.chapter.is-selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chapter:has(input:checked) .check,.chapter.is-selected .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chapter:has(input:focus-visible){box-shadow:var(--focus-ring)}
.chapter .number{font:var(--weight-regular) var(--text-xs)/1 var(--font-mono);color:var(--text-muted)}
.chapter strong{display:block;font-size:var(--text-sm);line-height:1.35;margin:var(--space-2) 0 var(--space-1);padding-right:var(--space-5)}
.chapter small{font-size:var(--text-xs);color:var(--text-muted)}

/* Hero: binary as a faint background texture; the label sits on its own solid plate so nothing overlaps. */
.hero-art{position:relative;isolation:isolate;display:grid;place-items:center;gap:var(--space-3);min-height:200px;padding:var(--space-6);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden}
.hero-art .binary{position:absolute;inset:0;z-index:-1;padding:var(--space-3);font:12px/22px var(--font-mono);letter-spacing:.35em;color:var(--text);opacity:.09;overflow:hidden;overflow-wrap:anywhere;user-select:none;
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 0 30%,#000 75%);mask-image:radial-gradient(ellipse at center,transparent 0 30%,#000 75%)}
.hero-art .orbit{font:var(--weight-semibold) var(--text-lg)/1 var(--font-mono);letter-spacing:.2em;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4) var(--space-5);box-shadow:var(--shadow)}
.hero-art .legend{font:var(--weight-semibold) var(--text-xs)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);background:var(--surface);border-radius:var(--radius-pill);padding:6px 10px}

/* Theme toggle */
.theme-toggle{display:inline-flex;gap:2px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius)}
.theme-toggle button{min-height:28px;padding:4px 10px;border:0;background:transparent;font-size:12px;color:var(--text-muted)}
.theme-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Sticky action bar for small screens */
.action-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
@media (max-width:620px){
  .stats{grid-template-columns:1fr 1fr}
  .action-bar{position:sticky;bottom:0;z-index:5;margin:var(--space-4) calc(-1 * var(--space-4)) 0;padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgb(15 23 42/.06)}
  .answer{min-height:56px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important;scroll-behavior:auto!important}}

/* CIS 4100 Study Studio layout. App-specific; uses only the Ink & Signal tokens in design/ink-signal/tokens.css. */
.skip-link{position:absolute;left:var(--space-4);top:-80px;z-index:30;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-3) var(--space-4)}
.skip-link:focus{top:var(--space-3)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* Site header (hidden during a session) */
.site-header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar{max-width:var(--content-width);margin:0 auto;min-height:64px;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5)}
.brand{display:flex;align-items:center;gap:var(--space-3);font-size:15px;font-weight:var(--weight-semibold);letter-spacing:-0.01em;white-space:nowrap;margin-right:auto}
.brand span:last-child{font-weight:var(--weight-regular);color:var(--text-muted)}
.brandmark{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font:var(--weight-bold) 13px/1 var(--font-mono)}
.topbar-end{display:flex;align-items:center;gap:var(--space-3)}
nav{display:flex;gap:2px}
nav button{background:transparent;border-color:transparent;color:var(--text-muted);font-weight:var(--weight-medium)}
nav button:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
nav button.active{background:var(--accent-soft);color:var(--text)}
.theme-cycle.icon-btn{display:none}
body.focus-mode .site-header,body.focus-mode footer{display:none}
main{max-width:var(--content-width);margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-8)}
body.focus-mode main{max-width:none;padding:0 0 var(--space-7)}
@media(max-width:620px){body.focus-mode main{padding-bottom:0}}
main:focus{outline:none}
footer{max-width:760px;margin:var(--space-7) auto 0;font-size:12px;color:var(--text-muted);padding-top:var(--space-4);border-top:1px solid var(--border)}
/* Shared pieces */
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;min-height:40px;padding:0;border-radius:var(--radius);background:transparent;border-color:transparent;font-size:18px;font-weight:var(--weight-medium);color:var(--text-muted)}
.icon-btn:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.quiet{background:transparent;border-color:transparent;color:var(--text-muted);font-weight:var(--weight-medium);padding-left:var(--space-2);padding-right:var(--space-2)}
.quiet:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.link{background:transparent;border-color:transparent;color:var(--accent);padding:6px var(--space-2);min-height:36px}
.link:hover:not(:disabled){background:var(--accent-soft)}
.btn-lg{min-height:48px;padding:12px var(--space-5);font-size:15px}
.note{font-size:13px;color:var(--text-muted);margin:var(--space-2) 0 0;line-height:1.5}
.statrow{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5);margin:var(--space-5) 0 var(--space-6);padding:0 var(--space-1);font-size:14px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.statrow b{color:var(--text);font-weight:var(--weight-semibold)}
.section-h{font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-muted);letter-spacing:0;margin:0 0 var(--space-3)}
.badge{display:inline-flex;align-items:center;font:var(--weight-medium) 11px/1 var(--font-mono);letter-spacing:.02em;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:5px 9px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:var(--space-5)}
.panel h2{margin-bottom:var(--space-3)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--space-5)}
.notice-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4);margin:var(--space-4) 0}
.banner{max-width:760px;margin:0 auto var(--space-4);border:1px solid var(--border);border-left:4px solid var(--flag);background:var(--surface);border-radius:var(--radius);padding:var(--space-3) var(--space-4);font-size:var(--text-sm)}
.error-state{margin:0;padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-left:4px solid var(--flag);border-radius:var(--radius);font-size:13px}
button.danger{color:var(--incorrect)}
.field label,.field .field-label{display:block;font-size:12px;font-weight:var(--weight-semibold);margin-bottom:6px;color:var(--text-muted)}
.fixed{margin:0;min-height:40px;display:flex;align-items:center;font-size:14px}
select,input[type=number],textarea,input[type=file]{width:100%;font:inherit;font-size:var(--text-sm);color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;min-height:40px;transition:border-color var(--duration) var(--ease)}
select:hover,input[type=number]:hover,textarea:hover{border-color:var(--text-muted)}
select:focus-visible,input:focus-visible,textarea:focus-visible{border-color:var(--accent);box-shadow:var(--focus-ring)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);background:var(--surface-2)}
#toast{position:fixed;bottom:var(--space-5);left:50%;transform:translateX(-50%);max-width:90vw;background:var(--text);color:var(--bg);padding:var(--space-3) var(--space-4);border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-raised);z-index:60}
/* Confirm dialog */
dialog#confirm-dialog{max-width:420px;width:calc(100% - 32px);border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);color:var(--text);box-shadow:var(--shadow-raised);padding:var(--space-5)}

.essay-outline summary{cursor:pointer;color:var(--accent);padding:8px 0}
.essay-outline li{margin-bottom:10px}
.essay-outline h3{margin-bottom:10px}
.pick{white-space:normal;text-align:left}
.qmeta .chip{white-space:normal}
@media(max-width:620px){nav{grid-template-columns:repeat(3,minmax(0,1fr))}.answer{padding:12px;font-size:14px}.question>.qactions{margin-top:16px}.question>.answer-buttons+.qactions,.question>#feedback-region+.qactions{margin-top:16px}}
/* Question bank and flashcards */
.page-narrow{max-width:860px;margin:0 auto}
.page-narrow .page-head{margin-bottom:var(--space-5)}
.page-narrow .page-head h1{margin:var(--space-2) 0}
.bank-tools{display:grid;gap:var(--space-4)}
.search-field{position:relative}
.search-field svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--text-muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
input[type=search]{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px 10px 40px;min-height:44px;transition:border-color var(--duration) var(--ease)}
input[type=search]:hover{border-color:var(--text-muted)}
input[type=search]:focus-visible{border-color:var(--accent);box-shadow:var(--focus-ring)}
.bank-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin:var(--space-5) 0 var(--space-3)}
.bank-bar p{margin:0;font-size:14px;color:var(--text-muted)}
.bank-bar b{color:var(--text)}
.bank-actions{display:flex;gap:var(--space-2)}
.bank-list{display:grid;gap:var(--space-3)}
.bank-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:var(--space-4) var(--space-5) var(--space-3)}
.bank-meta{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;min-height:32px}
.bank-topic{font-size:13px;font-weight:var(--weight-medium);color:var(--text-muted)}
.status{margin-left:auto;font-size:12px;font-weight:var(--weight-medium);color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:'';width:7px;height:7px;border-radius:var(--radius-pill);background:var(--border)}
.status.s-correct::before{background:var(--correct)}
.status.s-missed::before{background:var(--incorrect)}
.bank-flag{width:32px;height:32px;min-height:32px;font-size:15px}
.bank-flag[aria-pressed="true"]{color:var(--flag)}
.bank-stem,.fc-stem{font-size:16px;line-height:1.55;font-weight:var(--weight-medium);margin:var(--space-2) 0 var(--space-3);white-space:pre-wrap;overflow-wrap:break-word}
.bank-options{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bank-options li{display:flex;align-items:flex-start;gap:var(--space-3);padding:8px 10px;border:1px solid transparent;border-radius:var(--radius);font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.bank-options .option-letter{width:24px;height:24px;font-size:12px;color:var(--text-muted)}
.show-answers .is-key,.bank-item:has(.bank-reveal[open]) .is-key{background:var(--correct-soft);border-color:color-mix(in srgb,var(--correct) 45%,transparent)}
.show-answers .is-key .option-letter,.bank-item:has(.bank-reveal[open]) .is-key .option-letter{background:var(--correct);border-color:var(--correct);color:var(--surface)}
.bank-reveal{margin-top:var(--space-2)}
.bank-reveal summary{cursor:pointer;display:inline-flex;align-items:center;min-height:36px;font-size:13px;font-weight:var(--weight-medium);color:var(--accent)}
.bank-expl{margin:var(--space-2) 0 var(--space-1);padding:var(--space-3) var(--space-4);background:var(--surface-2);border-radius:var(--radius);font-size:14px;line-height:1.55}
@media(max-width:620px){
  .bank-item{padding:var(--space-3) var(--space-4)}
  .bank-actions{width:100%}.bank-actions button{flex:1}
  .bank-tools .chiprow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--space-4));padding:2px var(--space-4)}
  .bank-tools .chiprow::-webkit-scrollbar{display:none}
  .bank-tools .pick{white-space:nowrap;flex:none}
}
/* Flashcards: one card owns the screen; deck options live in a popover. */
.fc-page{display:flex;flex-direction:column}
.fc-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-3)}
.fc-title{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.fc-title h1{font-size:22px;letter-spacing:var(--tracking-tight);white-space:nowrap}
.fc-deck-wrap{position:relative;min-width:0}
.fc-deck{display:inline-flex;align-items:center;gap:var(--space-2);max-width:100%;min-height:36px;padding:6px 12px;border-radius:var(--radius-pill);font-weight:var(--weight-medium);font-size:13px;color:var(--text-muted);background:var(--surface);box-shadow:var(--shadow)}
.fc-deck:hover:not(:disabled),.fc-deck[aria-expanded="true"]{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--surface)}
.fc-deck svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fc-deck-label{overflow:hidden;text-overflow:ellipsis}
.fc-caret{font-size:11px;transition:transform var(--duration) var(--ease)}
.fc-deck[aria-expanded="true"] .fc-caret{transform:rotate(180deg)}
.fc-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:25;width:min(560px,calc(100vw - 32px));display:grid;gap:var(--space-2);padding:var(--space-4) var(--space-5) var(--space-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-raised),0 24px 48px rgb(0 0 0/.18);animation:fade-in 140ms var(--ease)}
.fc-pop[hidden]{display:none}
.fc-pop-label{margin:var(--space-2) 0 2px;font:var(--weight-semibold) 11px/1.4 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.fc-pop-label:first-child{margin-top:0}
.fc-pop .seg{justify-self:start}
.fc-pop-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);padding-top:var(--space-3);border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.fc-pop-foot .check-label{color:var(--text);font-size:13px}
.fc-pop .primary{justify-self:start}
.fc-source{margin:0 0 var(--space-2);font-size:14px;font-weight:var(--weight-medium)}
.fc-count{display:grid;justify-items:end;gap:2px;flex:none;font-variant-numeric:tabular-nums}
.fc-count-num{font-size:14px;color:var(--text-muted)}
.fc-count-num b{font-size:18px;color:var(--text)}
.fc-count-tally{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted)}
.fc-count-tally i{width:7px;height:7px;border-radius:var(--radius-pill);margin-left:6px}
.fc-count-tally i.t-known{background:var(--correct)}
.fc-count-tally i.t-learning{background:var(--incorrect)}
.fc-meter{height:3px;margin-bottom:var(--space-5)}
/* The card: front and back share one grid cell; the faint stack behind signals cards remaining. */
.fc{position:relative;isolation:isolate;cursor:pointer;border-radius:var(--radius-card)}
.fc:focus{outline:none;box-shadow:none}
.fc.stack-1::before,.fc.stack-2::before,.fc.stack-2::after{content:'';position:absolute;inset:0;z-index:-1;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);transform:translateY(8px) scale(.975);opacity:.75}
.fc.stack-2::after{transform:translateY(16px) scale(.95);opacity:.4;z-index:-2}
.fc-inner{display:grid;transform-style:preserve-3d;transition:transform 520ms cubic-bezier(.3,.7,.2,1)}
.is-flipped .fc-inner{transform:perspective(1800px) rotateY(180deg)}
.fc-face{grid-area:1/1;display:flex;flex-direction:column;min-height:clamp(320px,calc(100dvh - 400px),500px);padding:var(--space-5) var(--space-6);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-raised);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc:hover .fc-face{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.fc-back{transform:rotateY(180deg);background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--correct) 10%,var(--surface)),var(--surface) 60%);border-color:color-mix(in srgb,var(--correct) 35%,var(--border))}
.fc:hover .fc-back{border-color:color-mix(in srgb,var(--correct) 50%,var(--border))}
.fc-top{display:flex;align-items:center;gap:var(--space-2);min-height:28px}
.fc-top .status,.fc-back .fc-top .qid{margin-left:auto}
.fc-answer-label{font:var(--weight-semibold) 11px/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--correct)}
.fc-mid{margin:auto 0;padding:var(--space-5) 0}
.fc-stem{margin:0 0 var(--space-5);font-size:clamp(19px,2.3vw,24px);line-height:1.45;font-weight:var(--weight-semibold);letter-spacing:-0.012em;white-space:pre-wrap;overflow-wrap:break-word;text-wrap:pretty}
.fc-options{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
.fc-options li{display:flex;align-items:flex-start;gap:var(--space-3);padding:10px 12px;background:var(--surface-2);border-radius:var(--radius);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.fc-options .option-letter{width:22px;height:22px;font-size:11px;color:var(--text-muted);background:var(--surface)}
.fc-recap{margin:0 0 var(--space-4);font-size:14px;line-height:1.5;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-answer{display:flex;align-items:flex-start;gap:var(--space-3);margin:0 0 var(--space-4);font-size:clamp(20px,2.4vw,25px);font-weight:var(--weight-semibold);line-height:1.4;letter-spacing:-0.012em;overflow-wrap:anywhere}
.fc-answer .option-letter{width:32px;height:32px;margin-top:2px;font-size:14px;background:var(--correct);border-color:var(--correct);color:var(--surface)}
.fc-expl{margin:0;max-width:62ch;font-size:15px;line-height:1.65;color:var(--text-muted)}
.fc-hint{margin:0;text-align:center;font-size:12px;color:var(--text-muted);opacity:.85}
.fc-actions{display:flex;justify-content:center;align-items:center;gap:var(--space-3);margin-top:var(--space-5)}
.fc-actions-back,.is-flipped .fc-actions-front{display:none}
.is-flipped .fc-actions-back{display:flex}
#fc-flip{min-width:220px;border-radius:var(--radius-pill)}
.fc-nav{width:48px;height:48px;min-height:48px;padding:0;border-radius:var(--radius-pill);font-size:18px;color:var(--text-muted);box-shadow:var(--shadow)}
.fc-mark{min-width:180px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.fc-mark span{font-weight:var(--weight-bold)}
.fc-learning{background:var(--incorrect-soft);border-color:color-mix(in srgb,var(--incorrect) 40%,transparent)}
.fc-learning span{color:var(--incorrect)}
.fc-learning:hover:not(:disabled){background:var(--incorrect-soft);border-color:var(--incorrect)}
.fc-known{background:var(--correct-soft);border-color:color-mix(in srgb,var(--correct) 40%,transparent)}
.fc-known span{color:var(--correct)}
.fc-known:hover:not(:disabled){background:var(--correct-soft);border-color:var(--correct)}
.fc-keys{text-align:center;margin-top:var(--space-4)}
.fc-keys span{margin:0 4px;opacity:.6}
.fc-keys kbd{display:inline-block;min-width:20px;margin:0 2px;font-size:11px;padding:1px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--radius-sm);background:var(--surface);text-align:center}
.fc-in-next .fc{animation:fc-in-next 280ms var(--ease)}
.fc-in-prev .fc{animation:fc-in-prev 280ms var(--ease)}
@keyframes fc-in-next{from{opacity:0;transform:translateX(32px) rotate(.8deg)}to{opacity:1;transform:none}}
@keyframes fc-in-prev{from{opacity:0;transform:translateX(-32px) rotate(-.8deg)}to{opacity:1;transform:none}}
.fc-empty{display:grid;justify-items:center;gap:var(--space-4);padding:var(--space-8) var(--space-5);border:1px dashed var(--border);border-radius:var(--radius-card);text-align:center;color:var(--text-muted)}
.fc-empty p{margin:0}
.fc-done h2{font-size:28px;margin:var(--space-2) 0 0}
.fc-tally{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5);margin-top:var(--space-3);font-size:15px;color:var(--text-muted)}
.fc-tally b{color:var(--text)}
@media(max-width:720px){.fc-options{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){
  .fc-bar{align-items:flex-start}
  .fc-title{flex-direction:column;align-items:flex-start;gap:var(--space-2)}
  .fc-deck-wrap{position:static}
  .fc-bar{position:relative}
  .fc-pop{left:0;right:0;width:auto;padding:var(--space-4)}
  .fc-face{padding:var(--space-4)}
  .fc-mid{padding:var(--space-4) 0}
  .fc-actions{position:sticky;bottom:0;z-index:5;margin:0 calc(-1 * var(--space-4));padding:var(--space-4) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
  .fc-stem{font-size:18px;margin-bottom:var(--space-4)}
  .fc-options li{padding:8px 10px}
  .fc-hint{display:none}
  .fc-meter{margin-bottom:var(--space-4)}
  .fc-face{min-height:0}
  .fc-actions .fc-mark,#fc-flip{min-width:0;flex:1}
  .fc-keys{display:none}
}
@media (prefers-reduced-motion:reduce){.fc-inner{transition:none}.fc-in-next .fc,.fc-in-prev .fc,.fc-pop{animation:none}}
